<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindo01</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, "맑은 고딕", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f6f9; color: #202738; }
    main { width: min(100% - 32px, 480px); text-align: center; }
    h1 { margin: 0 0 28px; font-size: clamp(28px, 5vw, 40px); }
    a { display: block; padding: 20px 24px; border-radius: 14px; background: #2264dc; color: #fff; font-size: 18px; font-weight: 700; text-decoration: none; }
    a:hover { background: #174eb6; }
    a:focus-visible { outline: 3px solid #8cb4ff; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { body { background: #11151c; color: #f2f4f7; } }
  </style>
</head>
<body>
  <main>
    <h1>Mindo01</h1>
    <a href="./screen_feedback/">화면별 피드백</a>
  </main>
</body>
</html>
